services:
  # Optional local PostgreSQL container (matches cloud production environments)
  postgres:
    image: postgres:16-alpine
    container_name: health_monitor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_password
      POSTGRES_DB: health_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # FastAPI Telemetry Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health_monitor_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://health_user:health_password@postgres:5432/health_monitor
      - SECRET_KEY=super-secret-development-key-change-in-production
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    depends_on:
      - postgres

  # React + Vite Frontend Dashboard
  frontend:
    image: node:20-alpine
    container_name: health_monitor_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
