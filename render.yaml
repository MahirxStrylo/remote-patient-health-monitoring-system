# Render.com Blueprint — Free Cloud Deployment Configuration
# Deploy FastAPI backend and React frontend with free PostgreSQL integration
services:
  # 1. FastAPI ASGI Backend Service
  - type: web
    name: remote-health-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "admin1029"
      # Neon.tech or Render free Postgres connection string
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: STALE_READING_THRESHOLD_MINUTES
        value: "15"
      - key: MAX_ECG_SAMPLES_PER_BATCH
        value: "10000"

  # Note: The React frontend will be deployed separately on Vercel once the
  # backend is live and its assigned URL is obtained.
